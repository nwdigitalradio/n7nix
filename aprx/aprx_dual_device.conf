mycall N7NIX-4
# Lat Lon format: Degrees + Minutes ddmm.mmN & dddmm.mmW
myloc lat 4829.07N lon 12254.11W

# Comment out all dual baudrate config
# ONLY use -4 sid

#<interface>
#  callsign N7NIX-5
#  ax25-device N7NIX-5
#  tx-ok true
#</interface>

<interface>
  callsign $mycall
  ax25-device $mycall
  tx-ok true
</interface>

<logging>
  pidfile /var/run/aprx.pid
  rflog /var/log/aprx/aprx-rf.log
  aprxlog /var/log/aprx/aprx.log
</logging>

# Filter entries follow javAPRSSrvr syntax
# # Lat Lon format: Decimal degrees dd.dd & ddd.ddd
#  negative for West/South and positive for East/North.
<aprsis>
  login N7NIX
  passcode xxxxx
  server noam.aprs2.net 14580
  # positions within 40 km from my location
  filter   "m/40"
  # only messages sent to me by APRSIS
#  filter   "r/48.484/-122.902/50 t/m"
</aprsis>

<beacon>
  beaconmode radio
  cycle-size 36m
  beacon interface $mycall srccall $mycall symbol "I&" $myloc comment "APRX: Lopez Island 2M 1200 baud IGate N7NIX-4"
</beacon>

#<beacon>
#  beaconmode radio
#  cycle-size 18m
#  beacon interface n7nix-5 srccall n7nix-5 symbol "I#" $myloc comment "Lopez Island 2M 9600 baud IGate N7NIX-5 - basil@pacabunga.com "
#</beacon>

# Running aprx with options: -dddvv -f aprx.conf will
#  check configuration parse in great detail.
<digipeater>
  transmitter $mycall
#  ratelimit 60 120
  ratelimit 10 30
  <source>
    source $mycall
    # Fill-in digipeater
    relay-type directonly
    filter      -b/k7bls*
  </source>
  <source>
	source 		APRSIS
	relay-type 	third-party
	msg-path 	WIDE2-2  # gate TX with 2 hops for messages
	via-path	WIDE1-1  # gate TX with 1 hop for everything else
	viscous-delay 	6
        ratelimit       240 480  # I raise this above defaults due to bursts

        # Do not serve if more than 50km from this coordinate
        filter       "-r/48.484/-122.902/-50.0"  # Do not tx-gate outside 50km from station

        # Do not serve if more than 25km from this coordinate
#        filter		"r/48.484/-122.902/25 t/m"
#        filter "b/N0CALL r/48.484/-122.902/25"
#        filter          -b/k7bls*
        filter          "m/40"
        filter          -t/st
  </source>
</digipeater>

<telemetry>
	transmitter	$mycall
	via		WIDE2-2
	source		$mycall
</telemetry>
